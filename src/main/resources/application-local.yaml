spring:
  application:
    name: society-management
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/society_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}                    # ← From env only
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# ====================================
# JWT - Use environment variables ONLY
# ====================================
jwt:
  secret: ${JWT_SECRET}                           # ← Required, no default
  expiration: 86400000
  refresh-expiration: 604800000

# ====================================
# TWILIO - Use environment variables ONLY
# ====================================
twilio:
  enabled: ${TWILIO_ENABLED:false}                # ← Default to false
  account-sid: ${TWILIO_ACCOUNT_SID:}             # ← No default value
  auth-token: ${TWILIO_AUTH_TOKEN:}               # ← No default value
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:} # ← No default value
  default-country-code: ${TWILIO_COUNTRY_CODE:91}
  expiration-minutes: 5
  max-requests-per-window: 3
  max-verify-attempts: 5
  rate-limit-window-minutes: 5

otp:
  expiration-minutes: 5
  length: 6

logging:
  level:
    root: INFO
    com.society: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized                 # ← Changed for security

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
